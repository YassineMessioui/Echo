[project]
name = "echo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
    "typer>=0.29.1",
]

[project.scripts]
echo-clips = "echo.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model'"
markers = [
    "model: runs a real ML model (slow, downloads weights); opt in with `pytest -m model`",
    "ffmpeg: runs the real ffmpeg/ffprobe binaries; skipped automatically if not installed",
]
